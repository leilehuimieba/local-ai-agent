run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt

linters-settings:
  errcheck:
    exclude-functions:
      - (*os.File).Close
      - (io.Closer).Close
      - (*sql.DB).Close
      - (*sql.Rows).Close
      - os.Remove
      - os.RemoveAll

issues:
  exclude-use-default: false
